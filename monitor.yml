name: Monitor annunci case

on:
  schedule:
    - cron: "0 */6 * * *"   # ogni 6 ore
  workflow_dispatch: {}      # permette anche l'avvio manuale da GitHub

permissions:
  contents: write

jobs:
  controlla-annunci:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui lo scraper
        run: python scraper.py

      - name: Salva i risultati nel repo (se ci sono novità)
        run: |
          git config user.name "monitor-case-bot"
          git config user.email "actions@github.com"
          git add annunci.json
          git diff --staged --quiet || git commit -m "Aggiornamento annunci $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
